<!DOCTYPE html>
<html>
    <head>
        <style></style>
        <script src="https://code.jquery.com/jquery-3.1.0.min.js"></script>
        <script type="text/javascript">
            $(function(){
                $.getJSON("movie.json", function (json)
                    {
                        $("#title").html(json.title); 
                        var HTML="";
                            for (i in json.genres)
                            {   
                                HTML+=json.genres[i]+" | ";
                            }
                        $("#genre").html(HTML);                        
                        $("#release").html("Release Date: "+json.release_dates.theater+" | Runtime: "+json.runtime+" minutes")
                        $("#overview").html("<i>"+json.critics_consensus+"</i>"+"<br>+"+json.synopsis)
                        $("#ratings").html(json.ratings.critics_rating+" | "+json.ratings.critics_score)
                        var cHTML="";
                            for (i in json.abridged_cast)
                            {
                                cHTML+="<br>"+json.abridged_cast[i].name+ " - " +json.abridged_cast[i].characters[0];
                            }
                            $("#cast").html(cHTML);


                    
                    }); 
            })
        </script>
    </head>
    <body>
        <h1 id="title"></h1>
        <p id="ratings"></p>
        <span id="genre"></span>
        <p id="release"></p>
        <p id="overview"></p>
        <p id="cast"></p>

        

    </body>
</html>
