<!DOCTYPE html>
<html>
    <head>
        <style></style>
        <script src="https://code.jquery.com/jquery-3.1.0.min.js"></script>
    </head>
    <body>
        <p id="location"></p>
        <p id="temp"></p>
        <p id="weather"></p>
        <p id="humidity"></p>
        <p id="wind"></p>
        
	    <script type="text/javascript">
            $(function(){
                $.getJSON("weather.json", function (json)
                    {
                        $("#location").html("<b>Location</b><br>"+json.name+", "+json.sys.country+"<br>Longitude:"+json.coord.lon+" Latitude:"+json.coord.lat); 
                        $("#temp").html("<b>Temperature</b><br>"+json.main.temp+"℉")
                        $("#weather").html("<b>Weather</b><br>"+json.weather[0].main+", "+json.weather[0].description)
                        $("#humidity").html("<b>Humidity</b><br>"+json.main.humidity+"%")
                        $("#wind").html("<b>Wind</b><br>Speed:"+json.wind.speed+"m/s"+"<br>Degree:"+json.wind.deg+"°")                        

                    var courseHTML="";

                    for (i in json.Instructor.Course)
                    {
                        courseHTML+="<br>"+json.Instructor.Course[i].Title+ " - " +json.Instructor.Course[i].Enrollment;
                    }
                    $("#Course").html(courseHTML);
                    }); 
            })
        </script>
    </body>
</html>
