<!DOCTYPE html>
<html>
    <head>
        <style></style>
        <script src="https://code.jquery.com/jquery-3.1.0.min.js"></script>
	    <script type="text/javascript">
        $(function(){
                var json={
                    "Books": [
                            {
                                "Title":"Web Development Basics",
                                "Author":"Maya Lee",
                                "Price":"29.99"
                            },
                            {
                                "Title":"Modern Javscript",
                                "Author":"Daniel Kim",
                                "Price":"34.50"
                            },
                            {
                                "Title":"Understanding JSON",
                                "Author":"Sofia Patel",
                                "Price":"24.95"
                            }
                    ]
                };
            //Your webpage should display:
            // The title of the first book
            //The author of the first book
            //The price of the first book
            //The title and author of each book
            //The total number of books
            var count = 0;
            var HTML="";
            HTML+=json.Books[0].Title+"<br>"+json.Books[0].Author+"<br>"+json.Books[0].Price;
			for (i in json.Books)
            {   
                count++
                HTML+="<br>"+json.Books[i].Title+ " - " +json.Books[i].Author;
            }
            $("#library").html(HTML);
            $("#count").append(count)
        })

        </script>
    </head>
    <body>
<div id="library"></div>
<div id="count"></div>

    </body>
</html>
